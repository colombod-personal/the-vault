name: deploy
# Deploys to Vercel with the Vercel CLI. (Vercel's Hobby plan can't connect repositories owned by a
# GitHub organization in its dashboard; the CLI path works on every plan.)
#
# Needs the VERCEL_TOKEN repository secret. Optional repository variables:
#   VERCEL_SCOPE  a Vercel team slug (leave unset for a personal Hobby account)
#   VAULT_URL     the public URL for the post-deploy check (normally found automatically)
# jobs/vercel_setup.py sets SESSION_SECRET and BASE_URL in Vercel and writes a checklist of what
# is still missing (database, sign-in providers, redirect URIs) to the job summary.
on:
  push:
    # The first-release branch deploys too, until PR #1 is merged; then remove it and keep main only.
    branches: [main, claude/festive-mendel-9vr6vt]
  workflow_dispatch:
    inputs:
      target:
        description: "production or preview"
        type: choice
        options: [production, preview]
        default: production
concurrency: deploy-${{ github.ref }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_SCOPE: ${{ vars.VERCEL_SCOPE || 'wintermute2' }}
      TARGET: ${{ inputs.target || 'production' }}
    steps:
      - name: Check for the Vercel token
        id: token
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::notice::VERCEL_TOKEN is not set, so nothing was deployed. See README → Deploying on Vercel."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.token.outputs.ready == 'true'

      - uses: actions/setup-python@v5
        if: steps.token.outputs.ready == 'true'
        with:
          python-version: "3.12"

      - name: Tests must pass before deploying
        if: steps.token.outputs.ready == 'true'
        run: |
          pip install -e ".[dev]"
          pytest -q

      - uses: actions/setup-node@v4
        if: steps.token.outputs.ready == 'true'
        with:
          node-version: "20"

      - name: Deploy to Vercel
        id: deploy
        if: steps.token.outputs.ready == 'true'
        run: |
          npm install --global vercel@latest
          scope=(); [ -n "$VERCEL_SCOPE" ] && scope=(--scope "$VERCEL_SCOPE")
          prod=(); [ "$TARGET" = "production" ] && prod=(--prod)
          ship() {
            vercel pull --yes --environment="$TARGET" --token "$VERCEL_TOKEN" "${scope[@]}"
            vercel build "${prod[@]}" --token "$VERCEL_TOKEN" "${scope[@]}"
            vercel deploy --prebuilt "${prod[@]}" --token "$VERCEL_TOKEN" "${scope[@]}"
          }
          # Creates the "the-vault" project on the first run, links to it afterwards.
          vercel link --yes --project the-vault --token "$VERCEL_TOKEN" "${scope[@]}"
          # Sets SESSION_SECRET (and BASE_URL once the project has an address); reports what's missing.
          before=$(python -m jobs.vercel_setup)
          url=$(ship | tail -n 1)
          if [ "$(echo "$before" | python -c 'import json,sys; print(json.load(sys.stdin)["base_url"] or "")')" = "" ]; then
            # First deploy: the production address exists now. Record it as BASE_URL and redeploy with it.
            after=$(GITHUB_STEP_SUMMARY=/dev/null python -m jobs.vercel_setup)
            if echo "$after" | python -c 'import json,sys; sys.exit(0 if "BASE_URL" in json.load(sys.stdin)["changed"] else 1)'; then
              url=$(ship | tail -n 1)
              python -m jobs.vercel_setup >/dev/null  # refresh the checklist with the redirect URIs
            fi
          fi
          base=$(python -m jobs.vercel_setup --project the-vault 2>/dev/null | python -c 'import json,sys; print(json.load(sys.stdin)["base_url"] or "")' || true)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "base=${base:-${{ vars.VAULT_URL }}}" >> "$GITHUB_OUTPUT"
          echo "### Deployed ($TARGET): $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke-test the live site
        if: steps.token.outputs.ready == 'true' && env.TARGET == 'production' && steps.deploy.outputs.base != ''
        run: |
          site="${{ steps.deploy.outputs.base }}"
          for i in 1 2 3 4 5 6; do  # give a cold start a moment
            code=$(curl -s -o /dev/null -w '%{http_code}' "$site/api/health" || true)
            [ "$code" = "200" ] || [ "$code" = "503" ] && break
            sleep 10
          done
          python -m jobs.smoke_test "$site"
