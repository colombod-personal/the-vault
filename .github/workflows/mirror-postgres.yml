name: mirror-postgres
# Copies the official postgres:16 image (linux/amd64, what the runners use) from AWS public ECR to this organisation's
# GitHub package, so tests.yml and deploy.yml can pull it from ghcr.io with the job's own token instead of an anonymous
# public pull: public.ecr.aws refused the anonymous pull three times on 2026-10-11/12 ("toomanyrequests", vault-1dm).
# Weekly, so the mirror follows 16's patch releases; by hand when needed; only from main. The digests go in the summary.
on:
  schedule:
    - cron: "41 4 * * 1"  # Mondays 04:41 UTC
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mirror-postgres
  cancel-in-progress: false
jobs:
  mirror:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moves to Ubuntu 26 on 2026-10-19 (#180); move deliberately
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write  # push ghcr.io/<owner>/postgres with the job's own token; nothing else
    steps:
      - name: Copy postgres:16 (linux/amd64) to GHCR, digest unchanged
        env:
          SOURCE: docker://public.ecr.aws/docker/library/postgres:16
          TARGET: docker://ghcr.io/${{ github.repository_owner }}/postgres:16
          ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ github.token }}  # the job's own token (packages: write above), not a stored secret
        run: |
          set -euo pipefail
          for i in 1 2 3; do  # the anonymous ECR pull is the thing that rate-limits: try a few times, spaced out
            if skopeo copy --override-os linux --override-arch amd64 --preserve-digests \
                 --dest-creds "${ACTOR}:${GH_TOKEN}" "$SOURCE" "$TARGET"; then break; fi
            [ "$i" = 3 ] && exit 1
            sleep $((i * 60))
          done
          src=$(skopeo inspect --override-os linux --override-arch amd64 --format '{{.Digest}}' "$SOURCE")
          dst=$(skopeo inspect --creds "${ACTOR}:${GH_TOKEN}" --format '{{.Digest}}' "$TARGET")
          {
            echo "Source (${SOURCE#docker://}, linux/amd64): \`$src\`"
            echo "Mirror (${TARGET#docker://}): \`$dst\`"
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$src" = "$dst" ] || { echo "digest differs: $src vs $dst" >&2; exit 1; }
