# The production site must be open to everyone, not only to people signed in to Vercel. The deploy
# check (vercel-check.yml) tests each deployment's own URL, which Vercel's Standard Protection keeps
# behind its login, so it cannot see this. This tests the public domain, signed out, after every
# production deployment and once a day; it fails if the domain is behind a Vercel login or broken.
name: public-site
on:
  deployment_status:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public:
    if: >-
      github.event_name != 'deployment_status' ||
      (github.event.deployment_status.state == 'success' && startsWith(github.event.deployment.environment, 'Production'))
    # A newer production deployment replaces the release an older run waits for, so that run could
    # only fail: cancel it and check the newest. Set on the job, not the workflow, so preview
    # deployment events (which skip this job) never cancel a production check.
    concurrency:
      group: public-site-${{ github.event_name == 'deployment_status' && 'deploy' || github.run_id }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PUBLIC_URL: ${{ vars.PUBLIC_URL || 'https://mtgvault.cards' }}
      SMOKE_EXPECT_PUBLIC: "1"
      SMOKE_EXPECT_REGION: fra1
      # On a deployment event, the commit that was deployed; empty for the daily and manual runs.
      EXPECT_COMMIT: ${{ github.event.deployment.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - run: pip install --require-hashes --no-deps -r jobs/requirements-ops.txt
      - name: Smoke-test the public site, signed out
        run: |
          echo "Public site: $PUBLIC_URL" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$EXPECT_COMMIT" ]; then
            # After a production deployment the domain moves to it a little later, and the old release
            # also answers 200: wait until /api/health reports the deployed commit (up to 5 minutes).
            for i in $(seq 30); do
              live=$(curl -s "$PUBLIC_URL/api/health" | python -c 'import json,sys; print((json.load(sys.stdin) or {}).get("commit") or "")' 2>/dev/null || true)
              [ "$live" = "$EXPECT_COMMIT" ] && break
              sleep 10
            done
            # Only Vercel's Git integration creates these deployment events, and it always sets the
            # commit, so anything else (an older release, or one reporting no commit) is a failure.
            if [ "$live" != "$EXPECT_COMMIT" ]; then
              echo "::error::$PUBLIC_URL serves commit '${live:-none reported}' after 5 minutes, not the deployed $EXPECT_COMMIT"
              [ -z "$live" ] && echo "::error::No commit reported: turn on Vercel → Settings → Environment Variables → Automatically expose System Environment Variables (sync-prices does), then redeploy"
              exit 1
            fi
            echo "Serving the deployed commit $EXPECT_COMMIT" >> "$GITHUB_STEP_SUMMARY"
          fi
          python -m jobs.smoke_test "$PUBLIC_URL"
