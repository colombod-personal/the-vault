name: sync-catalog
# Daily: load the catalog (oracle cards, rulings, oracle tags) from Scryfall's bulk files into
# Postgres (jobs/sync_catalog.py, docs/catalog-design.md). Nothing loads unless the repository
# variable CATALOG_SOURCES names sources (comma-separated: oracle_cards, rulings, oracle_tags);
# each is enabled only after its terms are checked (docs/compliance.md). Runs only from main, in the
# "vercel-production" environment (README → Security). Same database address logic as sync-prices.
on:
  schedule:
    - cron: "47 10 * * *"   # after sync-prices (10:17); Scryfall regenerates bulk files around 09:00 UTC
  workflow_dispatch: {}
permissions:
  contents: read
concurrency: vercel-production  # one at a time with the manual deploy
jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: vercel-production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - run: |
          pip install --require-hashes --no-deps -r requirements-lock.txt  # exact versions, hash-checked
          pip install --no-build-isolation --no-deps -r requirements-vcs.txt  # mtg-toolkits at a pinned commit
      - run: npm install --global vercel@60.1.3  # before any secret is in the environment (used to read the database address)
      - name: Database address
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_SCOPE: ${{ vars.VERCEL_SCOPE || 'wintermute2' }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            [ -n "$VERCEL_TOKEN" ] || { echo "::error::Set DATABASE_URL (or VERCEL_TOKEN) in the vercel-production environment"; exit 1; }
            scope=(); [ -n "$VERCEL_SCOPE" ] && scope=(--scope "$VERCEL_SCOPE")
            vercel link --yes --project the-vault --token "$VERCEL_TOKEN" "${scope[@]}" >/dev/null
            vercel env pull .env.vercel --yes --environment=production --token "$VERCEL_TOKEN" "${scope[@]}" >/dev/null
            DATABASE_URL=$(python -c 'import re; t=open(".env.vercel").read(); m=re.search(r"^DATABASE_URL=\"?([^\"\n]*)", t, re.M); print(m.group(1) if m else "")')
            rm -f .env.vercel
            [ -n "$DATABASE_URL" ] || { echo "::error::No DATABASE_URL in Vercel yet: connect Neon (Vercel → Storage), or add the secret"; exit 1; }
          fi
          echo "::add-mask::$DATABASE_URL"
          echo "DATABASE_URL=$DATABASE_URL" >> "$GITHUB_ENV"
      - name: Load the catalog
        env:
          CATALOG_SOURCES: ${{ vars.CATALOG_SOURCES }}
        run: python -m jobs.sync_catalog

