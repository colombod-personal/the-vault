name: sync-limited
# Weekly (Monday, after sync-catalog): per-card Limited statistics from 17Lands' public data sets (jobs/sync_limited.py,
# docs/limited-data-design.md, #178). The job reads each game and draft file once as a stream, never writes it to disk, and keeps only
# per-card counts. Nothing loads unless the repository variable CATALOG_SOURCES names `limited_17lands` (comma-separated, with the other
# sources): that switch is the owner's, and it stays off until the first manual run has been checked. A run without it prints
# "not enabled" and ends. The weekly run needs no input: the job works out the rolling window itself (the 8 newest sets with a game file,
# for PremierDraft and TradDraft, a set not read until 14 days after its release, a set that leaves the window deleted: #417) and refuses to
# run when the 17Lands terms were last read more than 120 days ago (docs/compliance.md; the monthly limited-terms-monthly workflow reminds).
# `workflow_dispatch` may name `sets` (a manual fill: exactly those, no discovery, nothing deleted) and `formats`, and `force` (read again a
# file whose version is already loaded). Runs only from main, in the "vercel-production" environment (docs/developing.md → Security).
# Same database address logic as sync-catalog.
on:
  schedule:
    - cron: "17 11 * * 1"   # Mondays, after sync-catalog (10:47); 17Lands refreshes its files every few weeks, so most runs read nothing
  workflow_dispatch:
    inputs:
      sets:
        description: "17Lands set codes, comma-separated, to read exactly (empty, the usual: the rolling window of the 8 newest sets)"
        required: false
        default: ""
      formats:
        description: "PremierDraft and/or TradDraft, comma-separated (empty: both)"
        required: false
        default: ""
      force:
        description: "Read the files again even when this version is already loaded"
        type: boolean
        required: false
        default: false
permissions:
  contents: read
concurrency: vercel-production  # one at a time with the manual deploy and the other sync jobs
jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    outputs:  # the budget guard's message, for the alert job below (empty when storage is below 70%)
      storage_alert: ${{ steps.load.outputs.storage_alert }}
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moves to Ubuntu 26 on 2026-10-19 (#180); move deliberately
    timeout-minutes: 120  # a cap, not an estimate: the run time of the first real run is measured and recorded (design section 4)
    environment: vercel-production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - run: |
          pip install --require-hashes --no-deps -r requirements-lock.txt  # exact versions, hash-checked
          pip install --no-build-isolation --no-deps -r requirements-vcs.txt  # mtg-toolkits at a pinned commit
      - run: npm install --global vercel@60.1.3  # before any secret is in the environment (used to read the database address)
      - name: Database address
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_SCOPE: ${{ vars.VERCEL_SCOPE || 'wintermute-team' }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            [ -n "$VERCEL_TOKEN" ] || { echo "::error::Set DATABASE_URL (or VERCEL_TOKEN) in the vercel-production environment"; exit 1; }
            scope=(); [ -n "$VERCEL_SCOPE" ] && scope=(--scope "$VERCEL_SCOPE")
            vercel link --yes --project the-vault --token "$VERCEL_TOKEN" "${scope[@]}" >/dev/null
            vercel env pull .env.vercel --yes --environment=production --token "$VERCEL_TOKEN" "${scope[@]}" >/dev/null
            DATABASE_URL=$(python -c 'import re; t=open(".env.vercel").read(); m=re.search(r"^DATABASE_URL=\"?([^\"\n]*)", t, re.M); print(m.group(1) if m else "")')
            rm -f .env.vercel
            [ -n "$DATABASE_URL" ] || { echo "::error::No DATABASE_URL in Vercel yet: connect Neon (Vercel → Storage), or add the secret"; exit 1; }
          fi
          echo "::add-mask::$DATABASE_URL"
          echo "DATABASE_URL=$DATABASE_URL" >> "$GITHUB_ENV"
      - name: Load the Limited statistics
        id: load
        env:
          CATALOG_SOURCES: ${{ vars.CATALOG_SOURCES }}
          LIMITED_SETS: ${{ inputs.sets }}
          LIMITED_FORMATS: ${{ inputs.formats }}
          LIMITED_FORCE: ${{ inputs.force }}
        run: |
          args=()
          [ "$LIMITED_FORCE" = "true" ] && args+=(--force)
          python -m jobs.sync_limited "${args[@]}"  # refuses at 85% storage, fails at the end at 70% (jobs/db_budget.py)

  alert:
    # Opens or updates a GitHub issue when the budget guard failed the job (jobs/budget_alert.py, docs/catalog-design.md "Neon budget").
    # It holds only `issues: write` and this run's own token: no database address, no Vercel token, no environment, no secret.
    if: ${{ always() && github.ref == 'refs/heads/main' && (needs.sync.outputs.storage_alert != '') }}
    needs: sync
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moves to Ubuntu 26 on 2026-10-19 (#180); move deliberately
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - run: pip install --require-hashes --no-deps -r jobs/requirements-ops.txt  # httpx, hash-checked
      - name: Open or update the issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          STORAGE_ALERT: ${{ needs.sync.outputs.storage_alert }}
        run: python -m jobs.budget_alert --from-env
