name: sync-prices
# Daily: configure the Vercel project (jobs/vercel_setup.py: SESSION_SECRET, BASE_URL, checklist;
# redeploys production unless it was built from the current variables), then download
# Scryfall's bulk card file, match every collection, store prices and each user's collection
# value. Runs only from main, in the "vercel-production" environment (README → Security).
# Uses that environment's DATABASE_URL secret if set; otherwise it reads the database address
# from the Vercel project (Neon integration) with VERCEL_TOKEN.
on:
  schedule:
    - cron: "17 10 * * *"   # Scryfall regenerates bulk files around 09:00 UTC
  workflow_dispatch: {}
permissions:
  contents: read
concurrency: sync-prices
jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: vercel-production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - run: |
          pip install --require-hashes --no-deps -r requirements-lock.txt  # exact versions, hash-checked
          pip install --no-build-isolation --no-deps -r requirements-vcs.txt  # mtg-toolkits at a pinned commit
      - run: npm install --global vercel@60.1.3  # before any secret is in the environment
      - name: Configure the Vercel project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_SCOPE: ${{ vars.VERCEL_SCOPE || 'wintermute2' }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::warning::VERCEL_TOKEN is not set: add it to the vercel-production environment (Settings → Environments)"
            echo "⚠️ VERCEL_TOKEN is not set in the vercel-production environment, so the project wasn't configured." >> "$GITHUB_STEP_SUMMARY"
          else
            python -m jobs.vercel_setup --redeploy
          fi
      - name: Database address
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_SCOPE: ${{ vars.VERCEL_SCOPE || 'wintermute2' }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            [ -n "$VERCEL_TOKEN" ] || { echo "::error::Set DATABASE_URL (or VERCEL_TOKEN) in the vercel-production environment"; exit 1; }
            scope=(); [ -n "$VERCEL_SCOPE" ] && scope=(--scope "$VERCEL_SCOPE")
            vercel link --yes --project the-vault --token "$VERCEL_TOKEN" "${scope[@]}" >/dev/null
            vercel env pull .env.vercel --yes --environment=production --token "$VERCEL_TOKEN" "${scope[@]}" >/dev/null
            DATABASE_URL=$(python -c 'import re; t=open(".env.vercel").read(); m=re.search(r"^DATABASE_URL=\"?([^\"\n]*)", t, re.M); print(m.group(1) if m else "")')
            rm -f .env.vercel
            [ -n "$DATABASE_URL" ] || { echo "::error::No DATABASE_URL in Vercel yet: connect Neon (Vercel → Storage), or add the secret"; exit 1; }
          fi
          echo "::add-mask::$DATABASE_URL"
          echo "DATABASE_URL=$DATABASE_URL" >> "$GITHUB_ENV"
      - run: python -m jobs.sync_prices
