name: sync-prices
# Daily: download Scryfall's bulk card file, match every collection, store prices
# and each user's collection value. Needs the DATABASE_URL repository secret.
on:
  schedule:
    - cron: "17 10 * * *"   # Scryfall regenerates bulk files around 09:00 UTC
  workflow_dispatch: {}
concurrency: sync-prices
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: python -m jobs.sync_prices
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
