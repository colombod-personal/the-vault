name: sync-prices
# Daily: configure the Vercel project (jobs/vercel_setup.py: SESSION_SECRET, BASE_URL, checklist;
# redeploys production unless it was built from the current variables), then download
# Scryfall's bulk card file, match every collection, store prices and each user's collection
# value. Runs only from main, in the "vercel-production" environment (README → Security).
# Uses that environment's DATABASE_URL secret if set; otherwise it reads the database address
# from the Vercel project (Neon integration) with VERCEL_TOKEN.
on:
  schedule:
    - cron: "17 10 * * *"   # Scryfall regenerates bulk files around 09:00 UTC
  workflow_dispatch: {}
permissions:
  contents: read
concurrency: vercel-production  # one at a time with the manual deploy
jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    outputs:  # the budget guard's messages, for the alert job below (empty when nothing is near a limit)
      storage_alert: ${{ steps.sync.outputs.storage_alert }}
      usage_alert: ${{ steps.usage.outputs.usage_alert }}
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moves to Ubuntu 26 on 2026-10-19 (#180); move deliberately
    timeout-minutes: 30
    environment: vercel-production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - run: |
          pip install --require-hashes --no-deps -r requirements-lock.txt  # exact versions, hash-checked
          pip install --no-build-isolation --no-deps -r requirements-vcs.txt  # mtg-toolkits at a pinned commit
      - run: npm install --global vercel@60.1.3  # before any secret is in the environment
      - name: Configure the Vercel project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_SCOPE: ${{ vars.VERCEL_SCOPE || 'wintermute-team' }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::warning::VERCEL_TOKEN is not set: add it to the vercel-production environment (Settings → Environments)"
            echo "⚠️ VERCEL_TOKEN is not set in the vercel-production environment, so the project wasn't configured." >> "$GITHUB_STEP_SUMMARY"
          else
            python -m jobs.vercel_setup --redeploy
          fi
      - name: Database address
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_SCOPE: ${{ vars.VERCEL_SCOPE || 'wintermute-team' }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            [ -n "$VERCEL_TOKEN" ] || { echo "::error::Set DATABASE_URL (or VERCEL_TOKEN) in the vercel-production environment"; exit 1; }
            scope=(); [ -n "$VERCEL_SCOPE" ] && scope=(--scope "$VERCEL_SCOPE")
            vercel link --yes --project the-vault --token "$VERCEL_TOKEN" "${scope[@]}" >/dev/null
            vercel env pull .env.vercel --yes --environment=production --token "$VERCEL_TOKEN" "${scope[@]}" >/dev/null
            DATABASE_URL=$(python -c 'import re; t=open(".env.vercel").read(); m=re.search(r"^DATABASE_URL=\"?([^\"\n]*)", t, re.M); print(m.group(1) if m else "")')
            rm -f .env.vercel
            [ -n "$DATABASE_URL" ] || { echo "::error::No DATABASE_URL in Vercel yet: connect Neon (Vercel → Storage), or add the secret"; exit 1; }
          fi
          echo "::add-mask::$DATABASE_URL"
          echo "DATABASE_URL=$DATABASE_URL" >> "$GITHUB_ENV"
      - name: Sync prices
        id: sync
        env:
          CATALOG_SOURCES: ${{ vars.CATALOG_SOURCES }}  # "oracle_prices" also stores each card's cheapest price
        run: python -m jobs.sync_prices  # fails at the end, after its work, when storage is at 70% (jobs/db_budget.py)
      - name: Neon compute and network use this month
        id: usage
        if: ${{ !cancelled() }}
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}  # optional: without it this step only prints a notice (docs/catalog-design.md)
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
        run: python -m jobs.neon_usage  # fails at 70% of the free plan's compute hours or network transfer

  alert:
    # Opens or updates a GitHub issue when the budget guard failed the job (jobs/budget_alert.py, docs/catalog-design.md "Neon budget").
    # It holds only `issues: write` and this run's own token: no database address, no Vercel token, no environment, no secret.
    if: ${{ always() && github.ref == 'refs/heads/main' && (needs.sync.outputs.storage_alert != '' || needs.sync.outputs.usage_alert != '') }}
    needs: sync
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moves to Ubuntu 26 on 2026-10-19 (#180); move deliberately
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - run: pip install --require-hashes --no-deps -r jobs/requirements-ops.txt  # httpx, hash-checked
      - name: Open or update the issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          STORAGE_ALERT: ${{ needs.sync.outputs.storage_alert }}
          USAGE_ALERT: ${{ needs.sync.outputs.usage_alert }}
        run: python -m jobs.budget_alert --from-env
