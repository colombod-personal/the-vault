name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:  # production runs on Postgres (Neon): check the migrations there too
        image: postgres:16
        env:
          POSTGRES_USER: vault
          POSTGRES_PASSWORD: vault
          POSTGRES_DB: vault_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vault" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      VAULT_TEST_POSTGRES_URL: postgresql://vault:vault@localhost:5432/vault_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "22"
      - name: Front-end bundle matches a fresh build
        run: |
          npm --prefix web ci --no-audit --no-fund
          npm --prefix web run build
          git diff --exit-code -- public/app.bundle.js
