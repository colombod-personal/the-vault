name: twins-conformance
# Compares each digital twin with the real service it clones (tests/conformance).
# A failure means a real service changed, or a twin drifted: update the twin first.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q -m live tests/conformance
        env:
          TWINS_LIVE: "1"
