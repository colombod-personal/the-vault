name: vercel-check
# Vercel's GitHub integration deploys merges to main (vercel.json → ignoreCommand skips other branches).
# When a deployment succeeds:
# - configure (production deployments of main only): sets up the Vercel project with
#   jobs/vercel_setup.py (SESSION_SECRET, BASE_URL, checklist). It holds VERCEL_TOKEN from the
#   "vercel-production" environment, runs the default branch's code and installs only httpx.
# - smoke: tests that exact deployment from outside (jobs/smoke_test.py), with no secrets.
#   Previews behind Vercel Authentication are reported as protected.
on:
  deployment_status:
permissions:
  contents: read
jobs:
  configure:
    if: >-
      github.event.deployment_status.state == 'success' &&
      startsWith(github.event.deployment.environment, 'Production') &&
      github.event.deployment.ref == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: vercel-production
    env:
      VERCEL_SCOPE: ${{ vars.VERCEL_SCOPE || 'wintermute2' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "httpx>=0.27"
      - name: Configure the Vercel project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}  # this step only: nothing is installed here
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::warning::VERCEL_TOKEN is not set: add it to the vercel-production environment (Settings → Environments)"
            echo "⚠️ VERCEL_TOKEN is not set in the vercel-production environment, so the project wasn't configured." >> "$GITHUB_STEP_SUMMARY"
          else
            python -m jobs.vercel_setup
          fi

  smoke:
    if: github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      URL: ${{ github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}
      ENVIRONMENT: ${{ github.event.deployment.environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "httpx>=0.27"
      - name: Smoke-test this deployment
        env:
          SMOKE_EXPECT_REGION: ${{ startsWith(github.event.deployment.environment, 'Production') && 'fra1' || '' }}
        run: |
          echo "Deployment: $ENVIRONMENT $URL" >> "$GITHUB_STEP_SUMMARY"
          [ -n "$SMOKE_EXPECT_REGION" ] || unset SMOKE_EXPECT_REGION
          for i in 1 2 3 4 5 6; do  # a cold start can take a few seconds
            code=$(curl -s -o /dev/null -w '%{http_code}' "$URL/api/health" || true)
            [ "$code" = "000" ] || break
            sleep 10
          done
          python -m jobs.smoke_test "$URL"
