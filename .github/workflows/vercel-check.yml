name: vercel-check
# Vercel's GitHub integration deploys merges to main (vercel.json → ignoreCommand skips other branches).
# When a deployment succeeds, smoke tests that exact deployment from outside (jobs/smoke_test.py),
# with no secrets. Deployments behind Vercel Authentication are reported as protected.
# (Configuring the project needs VERCEL_TOKEN, which only main may use; deployment events carry a
# commit SHA, not a branch, so that runs in sync-prices instead.)
on:
  deployment_status:
permissions:
  contents: read
jobs:
  smoke:
    if: github.event.deployment_status.state == 'success'
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moves to Ubuntu 26 on 2026-10-19 (#180); move deliberately
    timeout-minutes: 10
    env:
      URL: ${{ github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}
      ENVIRONMENT: ${{ github.event.deployment.environment }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: ${{ github.event.deployment.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - run: pip install --require-hashes --no-deps -r jobs/requirements-ops.txt
      - name: Smoke-test this deployment
        env:
          SMOKE_EXPECT_REGION: ${{ startsWith(github.event.deployment.environment, 'Production') && 'fra1' || '' }}
        run: |
          echo "Deployment: $ENVIRONMENT $URL" >> "$GITHUB_STEP_SUMMARY"
          [ -n "$SMOKE_EXPECT_REGION" ] || unset SMOKE_EXPECT_REGION
          for i in 1 2 3 4 5 6; do  # a cold start can take a few seconds
            code=$(curl -s -o /dev/null -w '%{http_code}' "$URL/api/health" || true)
            [ "$code" = "000" ] || break
            sleep 10
          done
          python -m jobs.smoke_test "$URL"
