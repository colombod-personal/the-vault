# For writing migrations; the app applies them itself at startup (vault.db.Database.migrate).
#   DATABASE_URL=postgresql://vault:vault@localhost:5432/vault alembic revision --autogenerate -m "what changed"
[alembic]
script_location = vault/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s: %(message)s
