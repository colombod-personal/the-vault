[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "the-vault"
version = "0.1.0"
description = "The Vault: MTG collection manager and valuation app (FastAPI server on mtg-toolkits)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "authlib>=1.3",
    "cryptography>=42",
    "httpx>=0.27",
    "itsdangerous>=2.1",
    "python-multipart>=0.0.9",
    "mtg-toolkits @ git+https://github.com/colombod-personal/mtg-toolkits@aa099784ae0784dfea3aab157619c36d06390a8d",
]

[project.optional-dependencies]
dev = ["pytest>=8", "uvicorn[standard]>=0.30"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["vault"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
markers = ["live: talks to the real third-party services (conformance checks for the twins)"]
